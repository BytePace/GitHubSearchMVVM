plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bytepace.compose'
    compileSdk 34

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.3"
    }
}

dependencies {
    api(project(":core"))
    api 'androidx.core:core-ktx:1.10.1'
    api 'androidx.appcompat:appcompat:1.6.1'

    // UI
    //   -Compose
    api 'androidx.compose.ui:ui:1.5.0'
    api 'androidx.compose.foundation:foundation:1.5.0'
    api 'androidx.wear.compose:compose-foundation:1.2.0'
    api 'androidx.compose.ui:ui-tooling:1.5.0'
    api 'androidx.compose.ui:ui-tooling-preview:1.5.0'
    api 'androidx.lifecycle:lifecycle-runtime-compose:2.6.1'

    //   -Material
    api 'androidx.compose.material:material:1.5.0'
    api 'androidx.compose.material3:material3:1.1.1'
    api 'androidx.compose.material:material-icons-extended:1.5.0'
    api 'androidx.compose.material3:material3-window-size-class:1.1.1'
}